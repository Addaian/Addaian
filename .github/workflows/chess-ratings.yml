name: Update chess ratings

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate card
        working-directory: assets/src
        run: python chess_card.py ../ratings.svg
      - name: Commit if ratings changed
        run: |
          git diff --quiet assets/ratings.svg && { echo "No change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update chess ratings"
          git push
